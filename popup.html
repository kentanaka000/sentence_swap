<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .toggle-label {
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .status {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .status-label {
      color: #666;
    }

    .status-value {
      font-weight: 500;
    }

    .warning {
      margin-top: 12px;
      padding: 8px;
      background-color: #fff3cd;
      border-radius: 4px;
      font-size: 12px;
      color: #856404;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }

    .btn-primary:hover {
      background-color: #45a049;
    }

    .btn-secondary {
      background-color: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>
    <span>🔄</span>
    Sentence Swap
  </h1>

  <div class="toggle-row">
    <span class="toggle-label">Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status">
    <div class="status-row">
      <span class="status-label">Language:</span>
      <span class="status-value" id="languageDisplay">Spanish</span>
    </div>
    <div class="status-row">
      <span class="status-label">Percentage:</span>
      <span class="status-value" id="percentageDisplay">15%</span>
    </div>
  </div>

  <div id="apiWarning" class="warning" style="display: none;">
    ⚠️ API key not set. <a href="#" id="openOptions">Configure in settings</a>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="optionsBtn">Settings</button>
    <button class="btn-primary" id="reloadBtn">Reload Page</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
